<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ödev Takip Paneli</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#12141c">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ödev Takip">
<style>
  :root{
    --bg:#12141c;
    --bg-soft:#171a24;
    --surface:#1d212e;
    --surface-hi:#252a3a;
    --border:#2a2f42;
    --border-soft:#20242f;
    --text:#edeff5;
    --text-dim:#9298b0;
    --text-faint:#5c6178;
    --accent:#5eead4;
    --accent-ink:#052622;
    --danger:#fb7185;
    --danger-soft:#3a2129;
    --ring: 0 0 0 3px rgba(94,234,212,0.25);
    --serif: 'Iowan Old Style','Palatino Linotype','URW Palladio',Georgia,'Times New Roman',serif;
    --sans: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(94,234,212,0.06), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:1180px;margin:0 auto;padding:28px 20px 60px;}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    gap:16px;flex-wrap:wrap;margin-bottom:18px;
  }
  .topbar-left{display:flex;align-items:center;gap:14px;}
  .brand{display:flex;align-items:baseline;gap:10px;}
  .brand h1{font-family:var(--serif);font-size:26px;font-weight:600;margin:0;letter-spacing:.2px;}
  .brand span{color:var(--text-faint);font-size:13px;}

  .month-nav{display:flex;align-items:center;gap:6px;}
  .icon-btn{
    width:34px;height:34px;border-radius:10px;border:1px solid var(--border);
    background:var(--surface);color:var(--text-dim);display:flex;align-items:center;
    justify-content:center;cursor:pointer;transition:background .15s,color .15s,border-color .15s;
  }
  .icon-btn:hover{background:var(--surface-hi);color:var(--text);border-color:#333a52;}
  .month-title{font-family:var(--serif);font-size:19px;min-width:150px;text-align:center;font-weight:600;}

  .topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .btn{
    border:none;border-radius:10px;padding:9px 16px;font-size:14px;font-weight:600;
    cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-family:var(--sans);
    transition:transform .1s, opacity .15s;
  }
  .btn:active{transform:scale(.97);}
  .btn-ghost{background:var(--surface);color:var(--text-dim);border:1px solid var(--border);}
  .btn-ghost:hover{color:var(--text);border-color:#333a52;}
  .btn-accent{background:var(--accent);color:var(--accent-ink);}
  .btn-accent:hover{opacity:.9;}

  .view-tabs{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px;}
  .view-tab{border:none;background:transparent;color:var(--text-dim);font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:8px;cursor:pointer;font-family:var(--sans);transition:background .15s,color .15s;}
  .view-tab.active{background:var(--accent);color:var(--accent-ink);}

  .stats-strip{
    display:flex;gap:22px;flex-wrap:wrap;padding:14px 18px;margin-bottom:18px;
    background:var(--surface);border:1px solid var(--border);border-radius:14px;
  }
  .stat{display:flex;flex-direction:column;gap:2px;}
  .stat b{font-family:var(--serif);font-size:19px;font-weight:600;}
  .stat span{font-size:11.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;}
  .stat.danger b{color:var(--danger);}

  .layout{display:flex;gap:22px;align-items:flex-start;}
  .calendar-panel{flex:1.5;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px;min-width:0;}
  .weekday-row{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:6px;}
  .weekday-row div{text-align:center;font-size:11.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;padding-bottom:8px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-cell{
    aspect-ratio:1/0.92;border-radius:12px;border:1px solid var(--border-soft);
    background:var(--bg-soft);padding:8px 8px 6px;display:flex;flex-direction:column;
    cursor:pointer;transition:background .15s,border-color .15s;position:relative;
  }
  .cal-cell:hover{background:var(--surface-hi);border-color:#333a52;}
  .cal-cell.dim{opacity:.35;}
  .cal-cell.today{border-color:var(--accent);box-shadow:var(--ring);}
  .cal-cell.drop-target{background:var(--surface-hi);border-color:var(--accent);outline:1.5px dashed var(--accent);}
  .cal-day-num{font-family:var(--serif);font-size:16px;font-weight:600;color:var(--text);line-height:1;}
  .cal-cell.today .cal-day-num{color:var(--accent);}
  .cal-cell.has-overdue .cal-day-num{color:var(--danger);}
  .cal-dots{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto;}
  .cal-dot{width:6px;height:6px;border-radius:50%;flex:none;}
  .cal-more{font-size:10px;color:var(--text-faint);}

  .week-grid{display:flex;gap:8px;min-height:420px;}
  .week-col{flex:1;min-width:0;background:var(--bg-soft);border:1px solid var(--border-soft);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;transition:background .15s,border-color .15s;}
  .week-col.today{border-color:var(--accent);}
  .week-col.drop-target{background:var(--surface-hi);outline:1.5px dashed var(--accent);}
  .week-col-head{font-family:var(--serif);font-size:13px;font-weight:600;color:var(--text-dim);cursor:pointer;display:flex;justify-content:space-between;padding-bottom:6px;margin-bottom:2px;border-bottom:1px solid var(--border-soft);}
  .week-col-head span{color:var(--text);}
  .week-col-body{display:flex;flex-direction:column;gap:5px;min-height:60px;flex:1;}

  .day-timeline{border:1px solid var(--border-soft);border-radius:12px;overflow-y:auto;max-height:640px;}
  .day-hour-row{display:flex;border-bottom:1px solid var(--border-soft);min-height:44px;transition:background .15s;}
  .day-hour-row:last-child{border-bottom:none;}
  .day-hour-row.drop-target{background:var(--surface-hi);}
  .day-hour-label{width:56px;flex:none;padding:6px 8px;font-size:11px;color:var(--text-faint);border-right:1px solid var(--border-soft);}
  .day-hour-body{flex:1;padding:5px 8px;display:flex;flex-direction:column;gap:5px;cursor:pointer;}

  .mini-card{border-left:3px solid;padding:5px 7px;border-radius:7px;background:var(--surface);cursor:grab;}
  .mini-card.done{opacity:.5;}
  .mini-time{font-size:10px;color:var(--text-faint);}
  .mini-title{font-size:12px;color:var(--text);font-weight:600;line-height:1.3;}

  .dragging{opacity:.4;}

  .agenda-panel{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px;min-width:0;position:sticky;top:20px;}

  .search-row{display:flex;align-items:center;gap:8px;background:var(--bg-soft);border:1px solid var(--border);border-radius:10px;padding:8px 10px;margin-bottom:10px;}
  .search-row svg{flex:none;color:var(--text-faint);}
  .search-row input{flex:1;background:none;border:none;color:var(--text);font-size:13.5px;font-family:var(--sans);}
  .search-row input:focus{outline:none;}

  .chip-row{display:flex;flex-wrap:wrap;gap:6px;}
  .chip-row.subjects{margin-bottom:14px;}
  .chip{padding:6px 11px;border-radius:999px;border:1px solid var(--border);background:var(--bg-soft);color:var(--text-dim);font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-family:var(--sans);user-select:none;transition:background .15s,color .15s,border-color .15s,opacity .15s;}
  .chip:hover{border-color:#333a52;}
  .chip.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
  .chip.dimmed{opacity:.4;}
  .chip-dot{width:7px;height:7px;border-radius:50%;flex:none;}
  .chip-color{width:14px;height:14px;border-radius:50%;border:none;padding:0;cursor:pointer;-webkit-appearance:none;appearance:none;background:none;overflow:hidden;flex:none;}
  .chip-color::-webkit-color-swatch-wrapper{padding:0;}
  .chip-color::-webkit-color-swatch{border:none;border-radius:50%;}
  .chip-color::-moz-color-swatch{border:none;border-radius:50%;}

  .agenda-group{margin-bottom:18px;}
  .agenda-group:last-child{margin-bottom:0;}
  .agenda-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-faint);margin-bottom:8px;}
  .agenda-label.danger{color:var(--danger);}
  .agenda-empty{font-size:13px;color:var(--text-faint);padding:2px 0 4px;}

  .task{display:flex;align-items:flex-start;gap:10px;padding:9px 8px;border-radius:10px;margin-bottom:2px;transition:background .15s;}
  .task:hover{background:var(--surface-hi);}
  .task.dragging{opacity:.4;}
  .task-bar{width:3px;align-self:stretch;border-radius:2px;flex:none;margin-top:2px;}
  .task-check{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--border);background:var(--bg-soft);flex:none;margin-top:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--accent-ink);}
  .task-check.checked{background:var(--accent);border-color:var(--accent);}
  .task-body{flex:1;min-width:0;cursor:pointer;}
  .task-title-row{display:flex;align-items:center;gap:5px;}
  .task-title{font-size:13.5px;font-weight:600;color:var(--text);line-height:1.35;}
  .task.done .task-title{color:var(--text-faint);text-decoration:line-through;}
  .task-meta{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .task-meta.danger{color:var(--danger);}
  .task-del{width:24px;height:24px;border:none;background:transparent;color:var(--text-faint);cursor:pointer;border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;}
  .task-del:hover{color:var(--danger);background:var(--danger-soft);}
  .type-badge{font-size:9px;text-transform:uppercase;letter-spacing:.05em;background:var(--surface-hi);color:var(--text-dim);padding:2px 5px;border-radius:5px;font-weight:700;}

  .collapse-toggle{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--text-faint);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;cursor:pointer;padding:0;margin-bottom:8px;font-family:var(--sans);}
  .collapse-toggle:hover{color:var(--text-dim);}
  .collapse-toggle svg{transition:transform .15s;}
  .collapse-toggle.open svg{transform:rotate(90deg);}

  .modal-overlay{position:fixed;inset:0;background:rgba(8,9,14,.6);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;opacity:0;pointer-events:none;transition:opacity .15s;overflow-y:auto;}
  .modal-overlay.open{opacity:1;pointer-events:auto;}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px;width:100%;max-width:440px;transform:translateY(6px) scale(.98);transition:transform .15s;margin:auto;}
  .modal-overlay.open .modal{transform:translateY(0) scale(1);}
  .modal h2{font-family:var(--serif);font-size:19px;margin:0 0 16px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:6px;}
  .field input,.field textarea,.field select{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--border);background:var(--bg-soft);color:var(--text);font-size:14px;font-family:var(--sans);resize:vertical;}
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring);}
  .field-hint{font-size:11.5px;color:var(--text-faint);margin-top:6px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .link-btn{background:none;border:none;color:var(--accent);font-size:11.5px;cursor:pointer;padding:0;font-family:var(--sans);}
  .custom-reminder-row{display:flex;gap:6px;margin-top:8px;align-items:center;}
  .custom-reminder-row input{width:64px;flex:none;padding:7px 8px;border-radius:8px;border:1px solid var(--border);background:var(--bg-soft);color:var(--text);font-size:13px;}
  .custom-reminder-row select{padding:7px 8px;border-radius:8px;border:1px solid var(--border);background:var(--bg-soft);color:var(--text);font-size:13px;font-family:var(--sans);}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  .btn-danger-ghost{background:transparent;color:var(--danger);border:1px solid var(--danger-soft);}
  .btn-danger-ghost:hover{background:var(--danger-soft);}
  .flag-icon{color:var(--danger);flex:none;}
  .note-icon{color:var(--text-faint);flex:none;}

  @media (max-width:860px){
    .layout{flex-direction:column;}
    .agenda-panel{position:static;width:100%;}
    .cal-cell{aspect-ratio:1/0.75;}
    .week-grid{flex-direction:column;}
  }

  /* ---- App-level nav (Takvim / İstatistikler) ---- */
  .app-nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:18px;width:fit-content;}
  .app-nav button{border:none;background:transparent;color:var(--text-dim);font-size:13px;font-weight:600;padding:8px 16px;border-radius:9px;cursor:pointer;font-family:var(--sans);display:flex;align-items:center;gap:7px;transition:background .15s,color .15s;}
  .app-nav button.active{background:var(--accent);color:var(--accent-ink);}
  .app-nav button:hover:not(.active){color:var(--text);}

  .install-btn{display:none;}
  .install-btn.show{display:inline-flex;}

  /* ---- Animations ---- */
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .stat-card,.task,.mini-card,.cal-cell{animation:fadeUp .28s ease both;}
  .view-pane{animation:fadeUp .22s ease both;}

  /* ---- Stat cards (yeni) ---- */
  .stats-strip{gap:14px;}
  .stat-card{
    flex:1;min-width:130px;background:linear-gradient(160deg,var(--surface),var(--surface-hi));
    border:1px solid var(--border);border-radius:16px;padding:16px 16px 14px;
    display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;
  }
  .stat-card svg{color:var(--accent);opacity:.85;}
  .stat-card .stat-num{font-family:var(--serif);font-size:24px;font-weight:700;line-height:1;}
  .stat-card .stat-lbl{font-size:11.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;}
  .stat-card.danger .stat-num{color:var(--danger);}
  .stat-card.accent-strong{border-color:rgba(94,234,212,.35);}
  .stat-card .stat-sub{font-size:11px;color:var(--text-dim);}

  /* ---- İstatistik sayfası ---- */
  .stats-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:start;}
  @media (max-width:900px){.stats-grid{grid-template-columns:1fr;}}
  .panel-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px;}
  .panel-card h3{font-family:var(--serif);font-size:16px;margin:0 0 14px;font-weight:600;}
  .bar-chart{display:flex;align-items:flex-end;gap:10px;height:160px;padding-top:8px;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;height:100%;}
  .bar-track{flex:1;width:100%;max-width:30px;display:flex;flex-direction:column-reverse;justify-content:flex-start;background:var(--bg-soft);border-radius:7px;overflow:hidden;}
  .bar-fill{width:100%;background:linear-gradient(180deg,var(--accent),#38c2ab);border-radius:7px 7px 0 0;transition:height .4s ease;}
  .bar-day-label{font-size:11px;color:var(--text-faint);}
  .bar-count{font-size:11px;color:var(--text-dim);font-weight:600;}

  .donut-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
  .donut-legend{display:flex;flex-direction:column;gap:8px;flex:1;min-width:140px;}
  .legend-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-dim);}
  .legend-dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .legend-row b{color:var(--text);}

  .streak-box{display:flex;align-items:center;gap:14px;}
  .streak-flame{width:46px;height:46px;border-radius:14px;background:radial-gradient(circle at 30% 20%, #ffb454, #f97b6b);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 4px 14px rgba(249,123,107,.35);}
  .streak-num{font-family:var(--serif);font-size:26px;font-weight:700;}
  .streak-lbl{font-size:12px;color:var(--text-faint);}

  .subject-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .subject-bar-row:last-child{margin-bottom:0;}
  .subject-bar-name{width:88px;flex:none;font-size:12px;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .subject-bar-track{flex:1;height:8px;background:var(--bg-soft);border-radius:5px;overflow:hidden;}
  .subject-bar-fill{height:100%;border-radius:5px;}
  .subject-bar-count{width:26px;flex:none;text-align:right;font-size:11.5px;color:var(--text-faint);}

  .empty-note{font-size:13px;color:var(--text-faint);padding:10px 0;}

  /* ---- Toast ---- */
  .toast-stack{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:100;align-items:center;}
  .toast{background:var(--surface-hi);border:1px solid var(--border);color:var(--text);font-size:13px;padding:10px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:toastIn .18s ease both;display:flex;align-items:center;gap:8px;}
  .toast.ok{border-color:rgba(94,234,212,.4);}
  @keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  /* ---- Mobile bottom nav + FAB ---- */
  .mobile-bottom-nav{display:none;}
  @media (max-width:640px){
    .app{padding-bottom:84px;}
    .mobile-bottom-nav{
      display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);
      border-top:1px solid var(--border);z-index:60;padding:6px 8px calc(6px + env(safe-area-inset-bottom));
    }
    .mobile-bottom-nav button{flex:1;background:none;border:none;color:var(--text-faint);font-size:10.5px;
      display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer;font-family:var(--sans);}
    .mobile-bottom-nav button.active{color:var(--accent);}
    .fab{
      position:fixed;right:16px;bottom:74px;width:52px;height:52px;border-radius:16px;
      background:var(--accent);color:var(--accent-ink);border:none;display:flex;align-items:center;justify-content:center;
      box-shadow:0 10px 24px rgba(94,234,212,.35);cursor:pointer;z-index:60;
    }
    .topbar-right .btn-accent#addBtn, .topbar .month-nav{display:none;}
    .topbar-right{gap:8px;}
  }
</style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="topbar-left">
        <div class="brand">
          <h1>Ödev Takip</h1>
          <span>takvim &amp; ajanda</span>
        </div>
      </div>
      <div class="month-nav">
        <button class="icon-btn" id="prevNav" aria-label="Önceki">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="month-title" id="periodTitle">—</div>
        <button class="icon-btn" id="nextNav" aria-label="Sonraki">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="topbar-right">
        <div class="view-tabs" id="viewTabs">
          <button class="view-tab active" data-view="ay" type="button">Ay</button>
          <button class="view-tab" data-view="hafta" type="button">Hafta</button>
          <button class="view-tab" data-view="gun" type="button">Gün</button>
        </div>
        <button class="btn btn-ghost" id="todayBtn">Bugün</button>
        <button class="btn btn-ghost install-btn" id="installBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 3v13m0 0l-4-4m4 4l4-4M4 21h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Yükle
        </button>
        <button class="btn btn-accent" id="addBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
          Yeni
        </button>
      </div>
    </div>

    <div class="app-nav" id="appNav">
      <button class="active" data-pane="takvim" type="button">

const PALETTE = ["#f97b6b","#ffb454","#7dd3fc","#c4b5fd","#34d399","#f472b6","#fbbf24","#60a5fa"];

function loadCategoryColors(){

    const raw = localStorage.getItem("odevKategoriRenkleri");

  return {};

function saveCategoryColorsToStorage(map){

function colorFor(ders){
  const key = (ders || "Genel").trim() || "Genel";
  if (categoryColors[key]) return categoryColors[key];

  for (let i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) >>> 0;

}

let items = [];

function toLocalDate(utcStr){
  return new Date(utcStr + ":00Z");
}
function localDayKey(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function nowUtcStr(){
  return new Date().toISOString().slice(0,16);
}
function startOfWeek(d){
  const r = new Date(d);
  const diff = (r.getDay() + 6) % 7; // Pazartesi baslangic
  r.setDate(r.getDate() - diff);
  r.setHours(0,0,0,0);
  return r;
}

function visibleItems(){
  const q = searchText.trim().toLowerCase();
  return items.filter(it => {
    if (hiddenSubjects.has(it.ders || "Genel")) return false;
    if (!q) return true;
    return (it.baslik||"").toLowerCase().includes(q) || (it.ders||"").toLowerCase().includes(q);
  });
}

// ---- Recurrence expansion ----
function ruleOccurrences(baseDate, rule, rangeStart, rangeEnd){
  const out = [];
  if (!rule || !rule.tip || rule.tip === "yok"){
    if (baseDate >= rangeStart && baseDate < rangeEnd) out.push(baseDate);
    return out;
  }
  const defaultHorizon = new Date(rangeStart.getFullYear()+1, rangeStart.getMonth(), rangeStart.getDate());
  const limit = rule.bitis ? new Date(rule.bitis + "T23:59:00") : defaultHorizon;
  let cur = new Date(baseDate.getTime());
  let guard = 0;
  while (cur <= limit && cur < rangeEnd && guard < 2000){
    guard++;
    if (cur >= rangeStart && cur < rangeEnd){
      if (rule.tip !== "hafta_ici" || (cur.getDay() !== 0 && cur.getDay() !== 6)){
        out.push(new Date(cur.getTime()));
      }
    }
    if (rule.tip === "haftalik") cur.setDate(cur.getDate()+7);
    else if (rule.tip === "hafta_ici") cur.setDate(cur.getDate()+1);
    else if (rule.tip === "aylik_ilk_gun") cur = new Date(cur.getFullYear(), cur.getMonth()+1, 1, cur.getHours(), cur.getMinutes());
    else break;
  }
  return out;
}
function expandItemsForRange(baseItems, rangeStart, rangeEnd){
  const out = [];
  baseItems.forEach(it => {
    const start = toLocalDate(it.teslim_tarihi);
    const durMs = it.bitis_tarihi ? (toLocalDate(it.bitis_tarihi) - start) : 0;
    const occs = ruleOccurrences(start, it.tekrar, rangeStart, rangeEnd);
    occs.forEach(d => {
      out.push(Object.assign({}, it, {
        _occStart: d,
        _occEnd: durMs ? new Date(d.getTime()+durMs) : null,
        _virtual: d.getTime() !== start.getTime()
      }));
    });
  });
  return out;
}

// ---- Drag & drop moves ----
function moveItemToDay(id, dayKey){
  const it = items.find(x => x.id === id);
  if (!it) return;
  const oldStart = toLocalDate(it.teslim_tarihi);
  const [y,m,d] = dayKey.split("-").map(Number);
  const newStart = new Date(y, m-1, d, oldStart.getHours(), oldStart.getMinutes());
  const patch = { teslim_tarihi: newStart.toISOString().slice(0,16) };
  if (it.bitis_tarihi){
    const oldEnd = toLocalDate(it.bitis_tarihi);
    const deltaMs = newStart - oldStart;
    patch.bitis_tarihi = new Date(oldEnd.getTime() + deltaMs).toISOString().slice(0,16);
  }
  updateDoc(doc(db, "odevler", id), patch);
}
function moveItemToHour(id, dayDate, hour){
  const it = items.find(x => x.id === id);
  if (!it) return;
  const oldStart = toLocalDate(it.teslim_tarihi);
  const newStart = new Date(dayDate.getFullYear(), dayDate.getMonth(), dayDate.getDate(), hour, 0);
  const patch = { teslim_tarihi: newStart.toISOString().slice(0,16) };
  if (it.bitis_tarihi){
    const oldEnd = toLocalDate(it.bitis_tarihi);
    const deltaMs = newStart - oldStart;
    patch.bitis_tarihi = new Date(oldEnd.getTime() + deltaMs).toISOString().slice(0,16);
  }
  updateDoc(doc(db, "odevler", id), patch);
}
document.addEventListener("dragstart", (e) => {

document.addEventListener("dragend", (e) => {

// ---- Period title / nav ----
function renderPeriodTitle(){
  const ay = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
  const el = document.getElementById("periodTitle");
  if (viewMode === "ay"){
    el.textContent = ay[cursorDate.getMonth()] + " " + cursorDate.getFullYear();
  } else if (viewMode === "hafta"){
    const s = startOfWeek(cursorDate);
    const e = new Date(s); e.setDate(e.getDate()+6);
    el.textContent = s.getDate()+" "+ay[s.getMonth()].slice(0,3)+" – "+e.getDate()+" "+ay[e.getMonth()].slice(0,3);
  } else {
    el.textContent = cursorDate.toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric",weekday:"long"});
  }
}

function renderCalendar(){
  renderPeriodTitle();
  document.getElementById("weekdayRow").style.display = viewMode==="ay" ? "grid" : "none";
  document.getElementById("calGrid").style.display = viewMode==="ay" ? "grid" : "none";
  document.getElementById("weekGrid").style.display = viewMode==="hafta" ? "flex" : "none";
  document.getElementById("dayTimeline").style.display = viewMode==="gun" ? "block" : "none";
  if (viewMode === "ay") renderMonthView();
  else if (viewMode === "hafta") renderWeekView();
  else renderDayView();

function renderMonthView(){
  const grid = document.getElementById("calGrid");
  grid.innerHTML = "";
  const year = cursorDate.getFullYear(), month = cursorDate.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  let startOffset = firstOfMonth.getDay() - 1;
  if (startOffset < 0) startOffset = 6;
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();
  const todayKey = localDayKey(new Date());

  const cells = [];
  for (let i = startOffset - 1; i >= 0; i--){
    cells.push({day: daysInPrevMonth - i, dim:true, y:month===0?year-1:year, m:month===0?11:month-1});
  }
  for (let d = 1; d <= daysInMonth; d++){
    cells.push({day:d, dim:false, y:year, m:month});
  }
  let nextDay = 1;
  while (cells.length < 42){
    cells.push({day: nextDay++, dim:true, y:month===11?year+1:year, m:month===11?0:month+1});
  }

  const rangeStart = new Date(cells[0].y, cells[0].m, cells[0].day);
  const rangeEnd = new Date(cells[cells.length-1].y, cells[cells.length-1].m, cells[cells.length-1].day+1);
  const occs = expandItemsForRange(visibleItems(), rangeStart, rangeEnd);
  const byDay = {};
  occs.forEach(o => { const key = localDayKey(o._occStart); (byDay[key] = byDay[key] || []).push(o); });

  cells.forEach(c => {
    const key = c.y + "-" + String(c.m+1).padStart(2,"0") + "-" + String(c.day).padStart(2,"0");
    const dayItems = byDay[key] || [];
    const hasOverdue = dayItems.some(it => it.tur !== "etkinlik" && !it.tamamlandi && it.teslim_tarihi <= nowUtcStr());

    const cell = document.createElement("div");
    cell.className = "cal-cell" + (c.dim ? " dim" : "") + (key===todayKey ? " today":"") + (hasOverdue?" has-overdue":"");
    cell.innerHTML =
      '<div class="cal-day-num">' + c.day + '</div>' +
      '<div class="cal-dots">' +
        dayItems.slice(0,4).map(it => '<span class="cal-dot" style="background:'+colorFor(it.ders)+'"></span>').join("") +
        (dayItems.length > 4 ? '<span class="cal-more">+'+(dayItems.length-4)+'</span>' : "") +
      '</div>';
    cell.addEventListener("click", () => openModal(null, key));
    cell.addEventListener("dragover", (e) => { e.preventDefault(); cell.classList.add("drop-target"); });
    cell.addEventListener("dragleave", () => cell.classList.remove("drop-target"));
    cell.addEventListener("drop", (e) => {
      e.preventDefault(); cell.classList.remove("drop-target");
      const id = e.dataTransfer.getData("text/plain");
      if (id) moveItemToDay(id, key);
    });
    grid.appendChild(cell);
  });
}

function renderWeekView(){
  const wrap = document.getElementById("weekGrid");
  wrap.innerHTML = "";
  const start = startOfWeek(cursorDate);
  const dayNames = ["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"];
  const rangeEnd = new Date(start); rangeEnd.setDate(rangeEnd.getDate()+7);
  const occs = expandItemsForRange(visibleItems(), start, rangeEnd);
  const todayKey = localDayKey(new Date());

  for (let i = 0; i < 7; i++){
    const d = new Date(start); d.setDate(d.getDate()+i);
    const key = localDayKey(d);
    const dayOccs = occs.filter(o => localDayKey(o._occStart) === key).sort((a,b)=> a._occStart - b._occStart);
    const col = document.createElement("div");
    col.className = "week-col" + (key===todayKey ? " today" : "");
    col.innerHTML =
      '<div class="week-col-head">'+dayNames[i]+' <span>'+d.getDate()+'</span></div>'+
      '<div class="week-col-body">'+ dayOccs.map(weekCardHtml).join("") +'</div>';
    col.querySelector(".week-col-head").addEventListener("click", () => openModal(null, key));
    col.addEventListener("dragover", (e) => { e.preventDefault(); col.classList.add("drop-target"); });
    col.addEventListener("dragleave", () => col.classList.remove("drop-target"));
    col.addEventListener("drop", (e) => {
      e.preventDefault(); col.classList.remove("drop-target");
      const id = e.dataTransfer.getData("text/plain");
      if (id) moveItemToDay(id, key);
    });
    wrap.appendChild(col);
  }
  wrap.querySelectorAll("[data-open]").forEach(el => el.addEventListener("click", (e) => {
    e.stopPropagation(); openModal(el.getAttribute("data-open"));
  }));
}

function renderDayView(){
  const wrap = document.getElementById("dayTimeline");
  wrap.innerHTML = "";
  const dayStart = new Date(cursorDate.getFullYear(), cursorDate.getMonth(), cursorDate.getDate());
  const dayEnd = new Date(dayStart); dayEnd.setDate(dayEnd.getDate()+1);
  const occs = expandItemsForRange(visibleItems(), dayStart, dayEnd);
  const byHour = {};
  occs.forEach(o => { const h = o._occStart.getHours(); (byHour[h] = byHour[h] || []).push(o); });
  Object.keys(byHour).forEach(h => byHour[h].sort((a,b)=> a._occStart - b._occStart));

  for (let h = 0; h < 24; h++){
    const row = document.createElement("div");
    row.className = "day-hour-row";
    const hourItems = byHour[h] || [];
    row.innerHTML =
      '<div class="day-hour-label">'+String(h).padStart(2,"0")+':00</div>'+
      '<div class="day-hour-body">'+ hourItems.map(weekCardHtml).join("") +'</div>';
    row.addEventListener("dragover", (e) => { e.preventDefault(); row.classList.add("drop-target"); });
    row.addEventListener("dragleave", () => row.classList.remove("drop-target"));
    row.addEventListener("drop", (e) => {
      e.preventDefault(); row.classList.remove("drop-target");
      const id = e.dataTransfer.getData("text/plain");
      if (id) moveItemToHour(id, dayStart, h);
    });
    row.querySelector(".day-hour-body").addEventListener("click", (e) => {
      if (e.target.closest("[data-open]")) return;
      openModal(null, localDayKey(dayStart));
    });
    wrap.appendChild(row);
  }
  wrap.querySelectorAll("[data-open]").forEach(el => el.addEventListener("click", (e) => {
    e.stopPropagation(); openModal(el.getAttribute("data-open"));
  }));
}

function weekCardHtml(o){
  const timeLabel = fmtTime(o._occStart) + (o._occEnd ? "–"+fmtTime(o._occEnd) : "");
  return '<div class="mini-card'+(o.tamamlandi?" done":"")+'" data-open="'+o.id+'"'+
    (o._virtual ? '' : ' draggable="true" data-drag-id="'+o.id+'"') +
    ' style="border-left-color:'+colorFor(o.ders)+'">' +

function fmtDayLabel(d){ return d.toLocaleDateString("tr-TR", {day:"numeric", month:"long"}); }

function taskHtml(it){
  const d = toLocalDate(it.teslim_tarihi);
  const isEvent = it.tur === "etkinlik";
  const overdue = !isEvent && !it.tamamlandi && it.teslim_tarihi < nowUtcStr();
  const timeStr = isEvent && it.bitis_tarihi ? fmtTime(d)+"–"+fmtTime(toLocalDate(it.bitis_tarihi)) : fmtTime(d);
  return (
    '<div class="task'+(it.tamamlandi?" done":"")+'" draggable="true" data-drag-id="'+it.id+'">' +
      '<div class="task-bar" style="background:'+colorFor(it.ders)+'"></div>' +
      '<div class="task-check'+(it.tamamlandi?" checked":"")+'" data-check="'+it.id+'">' +
        (it.tamamlandi ? '<svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>' : '') +

        '<div class="task-title-row">' +
          (isEvent ? '<span class="type-badge">Etkinlik</span>' : "") +
          (it.oncelik === "yuksek" ? flagIcon() : "") +

          (it.notlar ? noteIcon() : "") +
          (it.tekrar && it.tekrar.tip && it.tekrar.tip!=="yok" ? repeatIcon() : "") +
        '</div>' +
        '<div class="task-meta'+(overdue?" danger":"")+'">'+(it.ders?escapeHtml(it.ders)+" · ":"")+fmtDayLabel(d)+", "+timeStr+'</div>' +
      '</div>' +
      '<button class="task-del" data-del="'+it.id+'" aria-label="Sil"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>' +
    '</div>'

function computeStreak(){
  const byDay = {};
  items.filter(it => it.tur !== "etkinlik").forEach(it => {
    const key = localDayKey(toLocalDate(it.teslim_tarihi));
    (byDay[key] = byDay[key] || []).push(it);
  });
  let streak = 0, emptyRun = 0;
  let cur = new Date(); cur.setHours(0,0,0,0);
  for (let i = 0; i < 365; i++){
    const key = localDayKey(cur);
    const dayItems = byDay[key];
    if (dayItems && dayItems.length){
      emptyRun = 0;
      if (dayItems.every(it => it.tamamlandi)) streak++;
      else break;
    } else {
      emptyRun++;
      if (emptyRun > 30) break;
    }
    cur.setDate(cur.getDate()-1);
  }
  return streak;
}

function renderWeeklyBarChart(){
  const wrap = document.getElementById("weeklyBarChart");
  if (!wrap) return;
  const dayNames = ["Paz","Pzt","Sal","Çar","Per","Cum","Cmt"];
  const today = new Date(); today.setHours(0,0,0,0);
  const days = [];
  for (let i = 6; i >= 0; i--){ const d = new Date(today); d.setDate(d.getDate()-i); days.push(d); }
  const byDay = {};
  items.filter(it => it.tur !== "etkinlik").forEach(it => {
    const key = localDayKey(toLocalDate(it.teslim_tarihi));
    (byDay[key] = byDay[key] || []).push(it);
  });
  const counts = days.map(d => {
    const arr = byDay[localDayKey(d)] || [];
    return { done: arr.filter(x => x.tamamlandi).length, total: arr.length };
  });
  const max = Math.max(1, ...counts.map(c => Math.max(c.done, c.total)));
  wrap.innerHTML = days.map((d,i) => {
    const c = counts[i];
    const h = Math.max(3, Math.round((c.done/max)*100));
    return '<div class="bar-col">' +
      '<div class="bar-count">'+c.done+'</div>' +
      '<div class="bar-track"><div class="bar-fill" style="height:'+h+'%"></div></div>' +
      '<div class="bar-day-label">'+dayNames[d.getDay()]+'</div>' +
    '</div>';
  }).join("");
}

function renderDonut(){
  const wrap = document.getElementById("donutWrap");
  if (!wrap) return;
  const counts = {};
  items.forEach(it => { const k = it.ders || "Genel"; counts[k] = (counts[k]||0)+1; });
  const entries = Object.entries(counts).sort((a,b) => b[1]-a[1]);
  if (!entries.length){ wrap.innerHTML = '<div class="empty-note">Henüz veri yok.</div>'; return; }
  const total = entries.reduce((s,e) => s+e[1], 0);
  let acc = 0;
  const r = 44, cx = 56, cy = 56, circumference = 2*Math.PI*r;
  const segs = entries.map(([name,count]) => {
    const frac = count/total;
    const dash = frac*circumference;
    const gap = circumference-dash;
    const rotate = (acc/total)*360;
    acc += count;
    return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+colorFor(name)+'" stroke-width="15" ' +
      'stroke-dasharray="'+dash.toFixed(1)+' '+gap.toFixed(1)+'" transform="rotate('+(rotate-90)+' '+cx+' '+cy+')"/>';
  }).join("");
  const svg = '<svg width="112" height="112" viewBox="0 0 112 112">'+segs+'</svg>';
  const legend = entries.map(([name,count]) =>
    '<div class="legend-row"><span class="legend-dot" style="background:'+colorFor(name)+'"></span>'+escapeHtml(name)+' <b>('+count+')</b></div>'
  ).join("");
  wrap.innerHTML = svg + '<div class="donut-legend">'+legend+'</div>';
}

function renderSubjectBars(){
  const wrap = document.getElementById("subjectBars");
  if (!wrap) return;
  const bySubj = {};
  items.forEach(it => { const k = it.ders || "Genel"; (bySubj[k] = bySubj[k] || []).push(it); });
  const entries = Object.entries(bySubj).sort((a,b) => b[1].length-a[1].length);
  if (!entries.length){ wrap.innerHTML = '<div class="empty-note">Henüz veri yok.</div>'; return; }
  const maxCount = Math.max(...entries.map(([,arr]) => arr.length));
  wrap.innerHTML = entries.map(([name,arr]) => {
    const w = Math.round((arr.length/maxCount)*100);
    return '<div class="subject-bar-row">' +
      '<div class="subject-bar-name">'+escapeHtml(name)+'</div>' +
      '<div class="subject-bar-track"><div class="subject-bar-fill" style="width:'+w+'%;background:'+colorFor(name)+'"></div></div>' +
      '<div class="subject-bar-count">'+arr.length+'</div>' +
    '</div>';
  }).join("");
}

function renderAgenda(){
  const content = document.getElementById("agendaContent");
  content.innerHTML = "";

  const vItems = visibleItems();
  const now = new Date();
  const nowStr = nowUtcStr();
  const todayKey = localDayKey(now);
  const tomorrow = new Date(now); tomorrow.setDate(tomorrow.getDate()+1);
  const tomorrowKey = localDayKey(tomorrow);
  const weekLimit = new Date(now); weekLimit.setDate(weekLimit.getDate()+7);

  const active = vItems.filter(it => !it.tamamlandi);
  const done = vItems.filter(it => it.tamamlandi);

  const gecikmis = active.filter(it => it.tur !== "etkinlik" && it.teslim_tarihi < nowStr && localDayKey(toLocalDate(it.teslim_tarihi)) !== todayKey);
  const bugun = active.filter(it => localDayKey(toLocalDate(it.teslim_tarihi)) === todayKey);
  const yarin = active.filter(it => localDayKey(toLocalDate(it.teslim_tarihi)) === tomorrowKey);
  const buHafta = active.filter(it => { const d = toLocalDate(it.teslim_tarihi); return d > tomorrow && d <= weekLimit; });
  const sonrasi = active.filter(it => toLocalDate(it.teslim_tarihi) > weekLimit);

  const groups = [
    {label:"Gecikmiş", data:gecikmis, danger:true},
    {label:"Bugün", data:bugun},
    {label:"Yarın", data:yarin},
    {label:"Bu Hafta", data:buHafta},
    {label:"Sonrası", data:sonrasi},
  ];

  groups.forEach(g => {
    if (g.data.length === 0) return;
    const wrap = document.createElement("div");
    wrap.className = "agenda-group";
    const sorted = g.data.slice().sort((a,b)=> a.teslim_tarihi.localeCompare(b.teslim_tarihi));
    wrap.innerHTML =
      '<div class="agenda-label'+(g.danger?" danger":"")+'">'+g.label+'</div>' +
      sorted.map(taskHtml).join("");
    content.appendChild(wrap);
  });

  if (gecikmis.length+bugun.length+yarin.length+buHafta.length+sonrasi.length === 0){
    const empty = document.createElement("div");
    empty.className = "agenda-empty";
    empty.textContent = items.length === 0
      ? "Yaklaşan kayıt yok. Takvimden bir güne tıklayarak ekleyebilirsin."
      : "Bu filtrelere uyan kayıt yok.";
    content.appendChild(empty);
  }

  const toggle = document.createElement("button");
  toggle.className = "collapse-toggle";
  toggle.innerHTML = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg> Tamamlanan (' + done.length + ')';
  const doneWrap = document.createElement("div");
  doneWrap.style.display = "none";
  doneWrap.innerHTML = done.slice().sort((a,b)=> b.teslim_tarihi.localeCompare(a.teslim_tarihi)).map(taskHtml).join("");
  toggle.addEventListener("click", () => {
    const open = doneWrap.style.display !== "none";
    doneWrap.style.display = open ? "none" : "block";
    toggle.classList.toggle("open", !open);
  });
  content.appendChild(toggle);
  content.appendChild(doneWrap);

  content.querySelectorAll("[data-check]").forEach(el => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      const id = el.getAttribute("data-check");
      const it = items.find(x => x.id === id);
      updateDoc(doc(db, "odevler", id), {tamamlandi: !it.tamamlandi});
    });
  });
  content.querySelectorAll("[data-open]").forEach(el => {
    el.addEventListener("click", () => openModal(el.getAttribute("data-open")));
  });
  content.querySelectorAll("[data-del]").forEach(el => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      if (confirm("Bu kaydı silmek istediğine emin misin?")){
        deleteDoc(doc(db, "odevler", el.getAttribute("data-del")));
      }
    });
  });
}

  editingId = id;
  extraReminderChips = [];
  document.getElementById("modalTitle").textContent = id ? "Kaydı Düzenle" : "Yeni Kayıt";
  deleteBtn.style.display = id ? "inline-flex" : "none";

  if (id){
    const it = items.find(x => x.id === id);
    fBaslik.value = it.baslik || "";
    fDers.value = it.ders || "";
    fNotlar.value = it.notlar || "";
    selectedPriority = it.oncelik || "orta";
    selectedType = it.tur || "gorev";
    selectedRepeat = (it.tekrar && it.tekrar.tip) || "yok";
    const d = toLocalDate(it.teslim_tarihi);
    fTarih.value = localDayKey(d) + "T" + String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
    if (it.bitis_tarihi){
      const bd = toLocalDate(it.bitis_tarihi);
      fBitis.value = localDayKey(bd) + "T" + String(bd.getHours()).padStart(2,"0") + ":" + String(bd.getMinutes()).padStart(2,"0");
    } else {
      fBitis.value = "";
    }
    fTekrarBitis.value = (it.tekrar && it.tekrar.bitis) || "";
    const existingDks = (it.hatirlatmalar || []).map(h => h.dk);
    existingDks.forEach(dk => { if (!allReminderOptions().some(o=>o.dk===dk)) extraReminderChips.push({dk, label: reminderLabel(dk)}); });
    selectedReminders = new Set(existingDks.length ? existingDks : loadDefaultReminders());
  } else {
    fBaslik.value = "";
    fDers.value = "";
    fNotlar.value = "";
    selectedPriority = "orta";
    selectedType = "gorev";
    selectedRepeat = "yok";
    fTarih.value = (dayKeyForNew || localDayKey(new Date())) + "T09:00";
    fBitis.value = (dayKeyForNew || localDayKey(new Date())) + "T10:00";
    fTekrarBitis.value = "";
    selectedReminders = new Set(loadDefaultReminders());
  }
  renderTypeChips();
  updateFormForType();
  renderRepeatChips();
  document.getElementById("repeatEndRow").style.display = selectedRepeat==="yok" ? "none" : "flex";
  renderPriorityChips();
  renderReminderChips();
  overlay.classList.add("open");
  setTimeout(() => fBaslik.focus(), 50);
}
function closeModal(){ overlay.classList.remove("open"); editingId = null; }

document.getElementById("addBtn").addEventListener("click", () => openModal(null));
document.getElementById("cancelBtn").addEventListener("click", closeModal);
overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModal(); });

document.getElementById("saveBtn").addEventListener("click", async () => {
  const baslik = fBaslik.value.trim();
  const ders = fDers.value.trim();
  const notlar = fNotlar.value.trim();
  const localVal = fTarih.value;
  if (!baslik || !localVal){
    toast("Lütfen başlık ve tarih gir.");
    return;
  }
  const utcVal = new Date(localVal).toISOString().slice(0,16);

  let eskiHatirlatma = {};
  if (editingId){
    const it = items.find(x => x.id === editingId);
    (it.hatirlatmalar || []).forEach(h => { eskiHatirlatma[h.dk] = h.gonderildi; });
  }
  const hatirlatmalar = Array.from(selectedReminders).sort((a,b)=>b-a).map(dk => ({
    dk, gonderildi: eskiHatirlatma.hasOwnProperty(dk) ? eskiHatirlatma[dk] : false
  }));

  const payload = {
    baslik, ders, teslim_tarihi: utcVal, oncelik: selectedPriority, notlar, hatirlatmalar,
    tur: selectedType,
    tekrar: { tip: selectedRepeat, bitis: (selectedRepeat!=="yok" && fTekrarBitis.value) ? fTekrarBitis.value : null },
  };
  if (selectedType === "etkinlik" && fBitis.value){
    payload.bitis_tarihi = new Date(fBitis.value).toISOString().slice(0,16);
  } else {
    payload.bitis_tarihi = null;
  }

  if (editingId){
    await updateDoc(doc(db, "odevler", editingId), payload);
    toast("Kaydedildi ✓", true);
  } else {
    await addDoc(odevlerRef, Object.assign({gonderildi:false, tamamlandi:false, olusturulma:new Date().toISOString()}, payload));
    toast("Eklendi ✓", true);
  }
  closeModal();
});

deleteBtn.addEventListener("click", async () => {
  if (!editingId) return;
  if (confirm("Bu kaydı silmek istediğine emin misin?")){
    await deleteDoc(doc(db, "odevler", editingId));
    closeModal();
    toast("Silindi", false);
  }
});

renderCalendar();
renderPriorityChips();

// ---- Pane switching (Takvim / İstatistikler) ----
function switchPane(pane){
  document.getElementById("paneTakvim").style.display = pane === "takvim" ? "" : "none";
  document.getElementById("paneIstatistik").style.display = pane === "istatistik" ? "" : "none";
  document.getElementById("statsStrip").style.display = pane === "istatistik" ? "none" : "flex";
  document.querySelectorAll("#appNav button, #mobileNav button").forEach(b => {
    b.classList.toggle("active", b.getAttribute("data-pane") === pane);
  });
  if (pane === "istatistik") renderStatsPage();
}
document.querySelectorAll("#appNav button, #mobileNav button").forEach(b => {
  b.addEventListener("click", () => switchPane(b.getAttribute("data-pane")));
});
document.getElementById("mobileFab").addEventListener("click", () => openModal(null));

// ---- PWA: service worker + install prompt ----
if ("serviceWorker" in navigator){
  window.addEventListener("load", () => { navigator.serviceWorker.register("/sw.js").catch(() => {}); });
}
let deferredPrompt = null;
const installBtn = document.getElementById("installBtn");
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.classList.add("show");
});
installBtn.addEventListener("click", async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  installBtn.classList.remove("show");
});
window.addEventListener("appinstalled", () => {
  installBtn.classList.remove("show");
  toast("Uygulama kuruldu 🎉", true);
});
</script>
