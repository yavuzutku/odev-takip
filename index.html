<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ödev Takip Paneli</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 420px; margin: 40px auto; padding: 20px; background: #0f172a; color: white; }
    .card { background: #1e293b; padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid #334155; }
    h2 { margin-top: 0; color: #38bdf8; text-align: center; }
    label { font-size: 14px; color: #94a3b8; display: block; margin-top: 12px; }
    input { width: 100%; padding: 12px; margin-top: 6px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; box-sizing: border-box; font-size: 15px; }
    button { width: 100%; padding: 12px; margin-top: 20px; border-radius: 8px; border: none; background: #22c55e; color: white; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; }
    button:hover { background: #16a34a; }
  </style>
</head>
<body>
  <div class="card">
    <h2>📚 Ödev Hatırlatıcı</h2>
    <form id="odevForm">
      <label>Ödev Adı / Konusu:</label>
      <input type="text" id="odevAdi" placeholder="Örn: Almanca Konuşma Sınavı" required>
      
      <label>Son Teslim Tarihi ve Saati:</label>
      <input type="datetime-local" id="teslimTarihi" required>
      
      <button type="submit">Ödevi Veritabanına Kaydet</button>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBmjtKsM358NaSawMYedj68bekuHW3tTuI",
      authDomain: "odev-takip-b382b.firebaseapp.com",
      projectId: "odev-takip-b382b",
      storageBucket: "odev-takip-b382b.firebasestorage.app",
      messagingSenderId: "589935632574",
      appId: "1:589935632574:web:a9338b99fca74256ee7eef",
      measurementId: "G-FEE7RTS3P0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById("odevForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const odevAdi = document.getElementById("odevAdi").value;
      const teslimTarihiLocal = document.getElementById("teslimTarihi").value;
      // datetime-local input'u tarayıcının yerel saatine göre gelir; sunucu (Render)
      // UTC karşılaştırması yaptığı için burada UTC'ye çevirip kaydediyoruz.
      const teslimTarihi = new Date(teslimTarihiLocal).toISOString().slice(0, 16);

      try {
        await addDoc(collection(db, "odevler"), {
          baslik: odevAdi,
          teslim_tarihi: teslimTarihi,
          gonderildi: false,
          olusturulma: new Date().toISOString()
        });
        alert("✅ Ödev başarıyla kaydedildi!");
        document.getElementById("odevForm").reset();
      } catch (error) {
        alert("Hata oluştu: " + error.message);
      }
    });
  </script>
</body>
</html>
